pluginManagement {
	// A MinecraftModConventions checkout beside this one can be older than
	// minecraftmodconventions_version, and an included build then replaces that
	// version whatever the build asks for. Opt in with -PuseLocalConventions.
	settings.ext.useLocalConventions = providers.gradleProperty('useLocalConventions')
			.map { it.isEmpty() || it.toBoolean() }
			.getOrElse(false)
	repositories {
		if (settings.ext.useLocalConventions) {
			maven {
				url = uri("../MinecraftModConventions/build/local-repo")
			}
		}
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.neoforged.net/releases/' }
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	resolutionStrategy {
		eachPlugin {
			def moduleName = [
					"io.github.brainage04.fabric-mod-conventions"      : "fabric-mod-conventions-gradle",
					"io.github.brainage04.multiloader-mod-conventions" : "multiloader-mod-conventions-gradle",
					"io.github.brainage04.client-gametest-recorder"    : "client-gametest-recorder-gradle",
					"io.github.brainage04.production-gametests"        : "production-gametests-gradle",
					"io.github.brainage04.workspace-dependencies"      : "workspace-dependencies-gradle",
					"io.github.brainage04.maven-central-publishing"    : "maven-central-publishing-gradle",
					"io.github.brainage04.mod-publishing"              : "mod-publishing-gradle",
			][requested.id.id]
			if (moduleName != null) {
				useModule("io.github.brainage04:${moduleName}:${requested.version}")
			}
		}
	}
}

if (settings.ext.useLocalConventions && file("../MinecraftModConventions/settings.gradle").exists()) {
	includeBuild("../MinecraftModConventions")
}

rootProject.name = 'VeinMiner'
include 'common', 'fabric', 'neoforge'
